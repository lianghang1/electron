<div>
  <div class="dc-card">
    <h2>身份证阅读 <span class="dc-hint">idcard.listDevices / idcard.readCard · PII 仅内存展示、不入日志</span></h2>
    <div class="dc-form" style="align-items:center">
      <div class="dc-field" style="min-width:260px">
        <label>读卡器</label>
        <select v-model="readerId" v-if="devices?.length">
          <option value="">（自动定位）</option>
          <option v-for="d in devices" :key="d.id" :value="d.id">{{ d.displayName }}（{{ TRANSPORT_LABEL[d.transport] ?? d.transport }}{{ d.status === 'ready' ? '' : d.status === 'offline' ? ' · 离线' : ' · 不可用' }}）</option>
        </select>
        <select v-else disabled>
          <option value="">{{ devices ? '未检测到身份证阅读器' : loadError ? `身份证阅读器不可用（${loadError}）` : '检测读卡器中…' }}</option>
        </select>
      </div>
      <span style="flex:1"></span>
      <button class="dc-btn" @click="openConfig">配置</button>
      <button class="dc-btn danger" @click="clearCard">清空</button>
    </div>
  </div>

  <div class="dc-card" v-if="devices?.length">
    <h2>读取证卡 <span class="dc-hint">idcard.readCard · deviceId 留空 = 自动定位首个就绪设备</span></h2>
    <div class="dc-form" style="align-items:center">
      <button class="dc-btn primary" :disabled="reading" @click="readCard">{{ reading ? '读取中…' : '读取证卡' }}</button>
      <span class="dc-hint-inline">{{ status }}</span>
    </div>
    <div v-if="card" style="display:flex;gap:16px;align-items:flex-start;margin-top:12px">
      <img v-if="card.photoDataUrl" :src="card.photoDataUrl" alt="证件照片"
        style="width:96px;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--dc-border,#ddd);flex-shrink:0">
      <div class="dc-list" style="flex:1;min-width:0">
        <div v-for="[key, label] in ID_FIELDS" :key="key" class="dc-list-row">
          <span class="row-hint">{{ label }}</span>
          <span class="sel-strong" style="flex:1;min-width:0;word-break:break-all">{{ card[key] ?? '—' }}</span>
        </div>
        <div class="dc-list-row">
          <span class="row-hint">有效期</span>
          <span class="sel-strong" style="flex:1;min-width:0;word-break:break-all">{{ card.validFrom ?? '—' }} 至 {{ card.validTo ?? '—' }}</span>
        </div>
      </div>
    </div>
    <p v-else class="dc-list-empty" style="border:1px dashed var(--dc-border);border-radius:5px;margin-top:12px">读卡成功后此处展示照片与证面字段</p>
  </div>
</div>
