<div>
  <div class="dc-card">
    <h2>阅读器枚举 <span class="dc-hint">idcard.listDevices · 接入方式与状态来自驱动声明</span></h2>
    <div class="dc-actions" style="margin-bottom:10px">
      <button class="dc-btn" @click="loadDevices">刷新阅读器</button>
    </div>
    <device-list :devices="devices"></device-list>
  </div>

  <div class="dc-card">
    <h2>读取身份证 <span class="dc-hint">idcard.readCard · deviceId 留空 = 自动定位首个就绪设备</span></h2>
    <div class="dc-form" style="margin-bottom:10px">
      <div class="dc-field">
        <label>读卡器</label>
        <select v-model="readerId">
          <option value="">（自动定位）</option>
          <option v-for="d in devices || []" :key="d.id" :value="d.id">
            {{ d.displayName }}（{{ TRANSPORT_LABEL[d.transport] ?? d.transport }}{{ d.status === 'ready' ? '' : d.status === 'offline' ? ' · 离线' : ' · 不可用' }}）
          </option>
        </select>
      </div>
      <div class="dc-field">
        <label>&nbsp;</label>
        <button class="dc-btn primary" :disabled="reading" @click="readCard">{{ reading ? '读取中…' : '读取' }}</button>
        <button class="dc-btn" @click="clearCard">清空结果</button>
      </div>
    </div>
    <p style="margin:0 0 10px;font-size:12px;color:var(--dc-text-sub)">{{ status }}</p>
    <div v-if="card" class="dc-idcard" style="display:flex;gap:16px;align-items:flex-start">
      <img v-if="card.photoDataUrl" :src="card.photoDataUrl" alt="证件照片"
        style="width:96px;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--dc-border,#ddd);flex-shrink:0">
      <dl class="dc-kv" style="flex:1;margin:0">
        <template v-for="[key, label] in ID_FIELDS" :key="key">
          <dt>{{ label }}</dt><dd style="user-select:all">{{ card[key] ?? '—' }}</dd>
        </template>
        <dt>有效期</dt><dd style="user-select:all">{{ card.validFrom ?? '—' }} 至 {{ card.validTo ?? '—' }}</dd>
      </dl>
    </div>
    <p v-else style="margin:0;font-size:12px;color:var(--dc-text-faint)">读卡成功后此处展示照片与证面字段（PII 仅内存展示，不落日志）</p>
  </div>

  <div class="dc-card">
    <h2>档案配置 <span class="dc-hint">idcard.getConfig / idcard.setConfig</span></h2>
    <div class="dc-actions" style="margin-bottom:10px">
      <button class="dc-btn" @click="loadConfig">idcard.getConfig</button>
    </div>
    <pre v-if="config" class="dc-log-detail" style="max-height:140px">{{ JSON.stringify(config, null, 2) }}</pre>
    <invoke-form method="idcard.setConfig" :def="setConfigDef" label="idcard.setConfig" />
  </div>
</div>
