<div>
  <div class="dc-card">
    <h2>扫码枪 <span class="dc-hint">scanner.statusUpdated 直推（插拔 / 通道切换即变）</span></h2>
    <div class="dc-form" style="align-items:center">
      <span class="dc-hint-inline">{{ hidStatus || '等待推送（未插枪则保持空态）' }}</span>
      <span style="flex:1"></span>
      <button class="dc-btn" @click="openConfig">配置</button>
    </div>
  </div>

  <div class="dc-card">
    <h2>模拟扫码 <span class="dc-hint">scanner.simulateScan · 与真枪走完全相同的缓冲 → 广播链路，仅开发态可用</span></h2>
    <div class="dc-form" style="align-items:center">
      <input v-model="scanInput" placeholder="如 PB:1234567890" style="min-width:240px;font-family:var(--dc-mono)" @keyup.enter="simulate">
      <button class="dc-btn primary" @click="simulate">模拟一次扫码</button>
      <button v-if="!bridgeReal" class="dc-btn sm" @click="mockScan">模拟事件（mock 桥）</button>
    </div>
  </div>

  <div class="dc-card">
    <h2>扫码历史（最近 20 条） <span class="dc-hint">scanner.scanned 点对点推送（{{ listening ? '监听中' : '未监听' }}）</span></h2>
    <div class="dc-actions" style="margin-bottom:10px">
      <button class="dc-btn danger" @click="clearScans">清空</button>
    </div>
    <div class="dc-list" v-if="scans.length">
      <div v-for="(s, i) in scans" :key="i" class="dc-list-row">
        <div class="grow">
          <div class="name sel-strong" style="word-break:break-all">{{ s.code }}</div>
          <div class="sub">{{ fmtTime(s.ts) }}<template v-if="s.prefix"> · 去前缀 {{ s.rawCode }}</template></div>
        </div>
        <span v-if="s.prefix" class="dc-chip brand">前缀 {{ s.prefix }}</span>
      </div>
    </div>
    <div v-else class="dc-list-empty">用扫码枪扫一下，或先模拟一条</div>
  </div>
</div>
