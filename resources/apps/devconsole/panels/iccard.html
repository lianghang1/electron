<div>
  <div class="dc-card">
    <h2>读写器枚举</h2>
    <div class="dc-actions" style="margin-bottom:10px">
      <button class="dc-btn" @click="loadDevices">iccard.listDevices</button>
    </div>
    <device-list :devices="devices"></device-list>
  </div>

  <div class="dc-grid-2">
    <div class="dc-card">
      <h2>读扇区 <span class="dc-hint">扇区 0-15；密钥 12 位 hex</span></h2>
      <invoke-form method="iccard.readSector" :def="readSectorDef" label="iccard.readSector" @result="onRead" />
      <pre v-if="sector" class="dc-log-detail" style="max-height:120px;margin-top:10px">{{ JSON.stringify(sector, null, 2) }}</pre>
    </div>
    <div class="dc-card">
      <h2>写数据块 <span class="dc-hint">块 0-63；数据 32 位 hex（16 字节）</span></h2>
      <invoke-form method="iccard.writeSector" :def="writeSectorDef" label="iccard.writeSector" />
    </div>
  </div>

  <div class="dc-card">
    <h2>写文本块 <span class="dc-hint">扇区 0-15，1-3 条文本</span></h2>
    <invoke-form method="iccard.writeTextBlocks" :def="writeTextsDef" label="iccard.writeTextBlocks" />
  </div>

  <div class="dc-card">
    <h2>档案配置</h2>
    <div class="dc-actions" style="margin-bottom:10px">
      <button class="dc-btn" @click="loadConfig">iccard.getConfig</button>
    </div>
    <pre v-if="config" class="dc-log-detail" style="max-height:140px">{{ JSON.stringify(config, null, 2) }}</pre>
    <invoke-form method="iccard.setConfig" :def="setConfigDef" label="iccard.setConfig" />
  </div>
</div>
