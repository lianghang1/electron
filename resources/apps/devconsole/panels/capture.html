<div>
  <div class="dc-card">
    <h2>采集设备 <span class="dc-hint">capture.listDevices / capture.listDeviceConfigs · 配置编辑走原生设置浮层</span></h2>
    <div class="dc-form" style="align-items:center">
      <div class="dc-field" style="min-width:260px">
        <label>设备</label>
        <select v-model="deviceSel" @change="onDeviceChange">
          <optgroup v-if="devices?.length" label="高拍仪 / 采集设备">
            <option v-for="d in devices" :key="d.id" :value="d.id">{{ d.displayName }}（{{ TRANSPORT_LABEL[d.transport] ?? d.transport }}{{ d.status === 'ready' ? '' : ' · 不可用' }}）</option>
          </optgroup>
          <optgroup v-if="cams.length" label="本机摄像头">
            <option v-for="(c, i) in cams" :key="c.deviceId || i" :value="UVC_PREFIX + (c.deviceId || i)">{{ c.label || `摄像头 ${i + 1}` }}</option>
          </optgroup>
          <option v-if="!devices?.length && !cams.length" value="" disabled>未检测到设备</option>
        </select>
      </div>
      <span style="flex:1"></span>
      <button class="dc-btn" @click="openConfig">配置</button>
    </div>
  </div>

  <div class="dc-card">
    <h2>预览与拍摄 <span class="dc-hint">capture.frame 点对点推送 · capture.captureImage 抓拍 · 离开面板自动停流</span></h2>
    <div class="dc-preview" style="min-height:320px">
      <span v-if="live" class="dc-rec">LIVE</span>
      <video v-show="uvcLive" ref="uvcVideo" playsinline muted :style="{ transform: mediaTransform, maxHeight: '360px', background: '#fff' }"></video>
      <img v-if="wsLive && frameUrl" :src="frameUrl" alt="实时预览" :style="{ transform: mediaTransform, maxHeight: '360px', background: '#fff' }">
      <img v-if="replaying && replayUrl" :src="replayUrl" alt="拍摄记录" :style="{ transform: mediaTransform, maxHeight: '360px', background: '#fff' }">
      <div v-if="!live && !replaying" class="dc-empty">{{ deviceSel ? '开启预览后此处显示实时画面' : '选择设备后拍摄' }}</div>
    </div>
    <div class="dc-actions" style="margin-top:10px; align-items:center">
      <button v-if="canOpen" class="dc-btn primary" @click="openLive">{{ openLabel }}</button>
      <button class="dc-btn primary" @click="shot">{{ shotLabel }}</button>
      <button v-if="canClose" class="dc-btn" @click="closeLive">关闭</button>
      <span class="dc-ops-sep"></span>
      <div class="dc-field dc-field--inline">
        <label>分辨率</label>
        <select v-model="resSel" @change="onResChange" :disabled="resDisabled">
          <option v-for="o in resOptions" :key="`${o.value}:${o.label}`" :value="o.value">{{ o.label }}</option>
        </select>
      </div>
      <button class="dc-btn" @click="rotate">旋转 90°</button>
      <button class="dc-btn" :class="{ primary: mirror }" @click="toggleMirror">镜像</button>
      <span style="flex:1"></span>
      <button class="dc-btn danger" @click="clearRecords">清空</button>
      <button class="dc-btn" :disabled="!currentRec?.imagePath" @click="printRecord">打印此图</button>
    </div>
    <div class="dc-actions" style="margin-top:10px" v-if="records.length">
      <img v-for="(r, i) in records" :key="i" :src="r.result.thumbDataUrl" :title="recordTitle(r)" @click="pickRecord(r)"
        style="width:56px;height:42px;object-fit:cover;border-radius:4px;cursor:pointer;outline:2px solid transparent"
        :style="currentRec === r.result ? 'outline-color:var(--dc-accent,#2563eb)' : ''" alt="记录">
    </div>
    <p style="margin:8px 0 0;font-size:12px;color:var(--dc-text-sub)">
      已收 {{ frameCount }} 帧
      <button v-if="!bridgeReal" class="dc-btn sm" style="margin-left:8px" @click="mockFrame">模拟一帧</button>
    </p>
  </div>

  <div class="dc-card">
    <h2>拍摄浮层 <span class="dc-hint">capture.openCaptureDialog · 自动携带当前所选设备与名称，结果进拍摄记录</span></h2>
    <div class="dc-form" style="align-items:center">
      <div class="dc-field dc-field--inline" style="min-width:260px">
        <label>浮层标题</label>
        <input v-model="dlgTitle" placeholder="拍摄浮层">
      </div>
      <div class="dc-field dc-field--inline">
        <label>可拍张数</label>
        <input v-model.number="dlgMax" type="number" min="1">
      </div>
      <button class="dc-btn primary" :disabled="dlgBusy" @click="openDialog">拍摄浮层</button>
      <span v-if="dlgBusy" class="dc-hint-inline">浮层进行中——预览与拍摄在浮层窗内闭环，确认后整批回传。</span>
    </div>
  </div>
</div>
