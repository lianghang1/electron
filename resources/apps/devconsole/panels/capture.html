<div>
  <div class="dc-card">
    <h2>采集设备枚举</h2>
    <div class="dc-actions" style="margin-bottom:10px">
      <button class="dc-btn" @click="loadDevices">capture.listDevices</button>
    </div>
    <device-list :devices="devices"></device-list>
  </div>

  <div class="dc-grid-2">
    <div class="dc-card">
      <h2>实时预览 <span class="dc-hint">capture.frame 点对点推送，离开面板自动停流</span></h2>
      <div class="dc-form" style="margin-bottom:10px">
        <div class="dc-field">
          <label>设备</label>
          <select v-model="previewDeviceId">
            <option value="">（缺省设备）</option>
            <option v-for="d in devices || []" :key="d.id" :value="d.id">{{ d.displayName }}</option>
          </select>
        </div>
        <div class="dc-field">
          <label>&nbsp;</label>
          <button v-if="!previewing" class="dc-btn primary" @click="startPreview">startPreview</button>
          <button v-else class="dc-btn danger" @click="stopPreview">stopPreview</button>
        </div>
      </div>
      <div class="dc-preview">
        <span v-if="previewing" class="dc-rec">LIVE</span>
        <img v-if="frameUrl" :src="frameUrl" alt="预览帧">
        <div v-else class="dc-empty">{{ previewing ? '等待帧推送…' : '预览未启动' }}</div>
      </div>
      <p style="margin:8px 0 0;font-size:12px;color:var(--dc-text-sub)">
        已收 {{ frameCount }} 帧
        <button v-if="!bridgeReal" class="dc-btn sm" style="margin-left:8px" @click="mockFrame">模拟一帧</button>
      </p>
    </div>

    <div class="dc-card">
      <h2>抓拍与保存</h2>
      <invoke-form method="capture.captureImage" :def="captureImageDef" label="capture.captureImage" @result="onCaptured" />
      <div v-if="shot?.dataUrl" style="margin-top:10px">
        <div class="dc-preview" style="min-height:120px">
          <img :src="shot.dataUrl" alt="抓拍结果">
        </div>
        <div class="dc-actions" style="margin-top:10px">
          <button class="dc-btn" @click="saveShot">capture.saveCapturedImage</button>
        </div>
      </div>
    </div>
  </div>

  <div class="dc-card">
    <h2>原生拍摄浮层 <span class="dc-hint">capture.openCaptureDialog · invoke 挂起至浮层确认/取消</span></h2>
    <div class="dc-form" style="margin-bottom:10px">
      <div class="dc-field">
        <label>浮层标题</label>
        <input v-model="dlgTitle" placeholder="拍摄浮层">
      </div>
      <div class="dc-field">
        <label>可拍张数</label>
        <input v-model.number="dlgMax" type="number" min="1">
      </div>
      <div class="dc-field">
        <label>预选设备</label>
        <select v-model="dlgDeviceId">
          <option value="">（缺省设备）</option>
          <option v-for="d in devices || []" :key="d.id" :value="d.id">{{ d.displayName }}</option>
        </select>
      </div>
      <div class="dc-field">
        <label>&nbsp;</label>
        <button class="dc-btn primary" :disabled="dlgBusy" @click="openDialog">capture.openCaptureDialog</button>
      </div>
    </div>
    <p v-if="dlgBusy" style="margin:0;font-size:12px;color:var(--dc-warn)">浮层进行中——预览与拍摄在浮层窗内闭环，确认后整批回传。</p>
    <div v-if="dlgResults.length" class="dc-grid-3" style="margin-top:10px">
      <div v-for="(r, i) in dlgResults" :key="i" class="dc-device-card">
        <div class="dc-preview" style="min-height:110px;border-radius:5px 5px 0 0">
          <img :src="r.thumbDataUrl" alt="拍摄结果">
        </div>
        <div style="padding:6px 10px;font-size:10px;font-family:var(--dc-mono);color:var(--dc-text-faint);word-break:break-all">
          {{ r.imagePath }}
        </div>
      </div>
    </div>
    <div v-else-if="dlgDone" class="dc-empty">已取消（空数组）</div>
  </div>
</div>
