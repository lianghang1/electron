<div>
  <div class="dc-card">
    <h2>打印机枚举</h2>
    <div class="dc-actions" style="margin-bottom:10px">
      <button class="dc-btn" @click="loadDevices">print.listDevices</button>
    </div>
    <device-list :devices="devices"></device-list>
  </div>

  <div class="dc-card">
    <h2>提交打印任务 <span class="dc-hint">printContent 判别联合：html / url / file；paper 必填</span></h2>
    <invoke-form method="print.submitPrintJob" :def="submitDef" label="print.submitPrintJob" @result="onSubmitted" />
    <p v-if="lastSubmit" style="margin:10px 0 0;font-size:12px">
      任务已提交：<code>{{ lastSubmit.printJobId }}</code>
    </p>
  </div>

  <div class="dc-card">
    <h2>任务簿 <span class="dc-hint">打印任务留痕：查询 / 重打 / 移除 / 清空</span></h2>
    <div class="dc-actions" style="margin-bottom:10px">
      <button class="dc-btn" @click="loadJobs">print.listPrintJobs</button>
      <button class="dc-btn danger" @click="clearJobs">print.clearPrintJobs</button>
    </div>
    <table v-if="jobs?.length" class="dc-table">
      <thead><tr><th>任务 id</th><th>状态</th><th>类型</th><th>时间</th><th>操作</th></tr></thead>
      <tbody>
        <tr v-for="job in jobs" :key="job.printJobId">
          <td><code>{{ job.printJobId }}</code></td>
          <td><span class="dc-badge" :class="job.status === 'done' || job.status === 'archived' ? 'ok' : ''">{{ job.status }}</span></td>
          <td>{{ job.kind ?? '—' }}</td>
          <td>{{ new Date(job.createdAt).toLocaleString() }}</td>
          <td>
            <button class="dc-btn sm" @click="reprint(job)">重打</button>
            <button class="dc-btn sm danger" @click="removeJob(job)">移除</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div v-else-if="jobs" class="dc-empty">任务簿为空</div>
  </div>
</div>
