name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 护栏：全仓零容忍，注释词表/类型逃逸/依赖边界任一违规都失败
      - name: Guard (full)
        run: pnpm guard

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Update e2e
        run: pnpm test:e2e:update

      - name: Build (three targets)
        run: pnpm build

      # 构建后不得出现逐包 dist（源码直引约定的机器证明）
      - name: No intermediate dist
        run: |
          count=$(find packages -type d -name dist | wc -l)
          echo "dist dirs: $count"
          test "$count" -eq 0
