<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  @page { size: {{pageWidthMm}}mm auto; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: {{printableWidthMm}}mm;
    font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', monospace;
    font-size: 12px;
    color: #000;
    background: #fff;
  }
  .receipt { padding: 2mm 1mm; }
  .shop { text-align: center; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
  .sub { text-align: center; font-size: 10px; margin-top: 1mm; }
  .divider { border-top: 1px dashed #000; margin: 2mm 0; }
  .meta { font-size: 11px; line-height: 1.6; }
  .meta .row { display: flex; justify-content: space-between; }
  table.items { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.items th { text-align: left; border-bottom: 1px solid #000; padding: 1mm 0; font-weight: normal; }
  table.items td { padding: 1mm 0; vertical-align: top; }
  table.items .name { width: 46%; }
  table.items .qty { width: 14%; text-align: center; }
  table.items .price { width: 20%; text-align: right; }
  table.items .amount { width: 20%; text-align: right; }
  .total { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; }
  .qr { text-align: center; margin-top: 2mm; }
  .footer { text-align: center; font-size: 10px; margin-top: 2mm; line-height: 1.5; }
</style>
</head>
<body>
  <div class="receipt">
    <div class="shop">{{shopName}}</div>
    <div class="sub">{{shopSub}}</div>
    <div class="divider"></div>
    <div class="meta">
      <div class="row"><span>单号</span><span>{{orderNo}}</span></div>
      <div class="row"><span>时间</span><span>{{time}}</span></div>
      <div class="row"><span>收银员</span><span>{{cashier}}</span></div>
    </div>
    <div class="divider"></div>
    <table class="items">
      <thead>
        <tr><th class="name">品名</th><th class="qty">数量</th><th class="price">单价</th><th class="amount">小计</th></tr>
      </thead>
      <tbody>
        {{#each items}}
        <tr>
          <td class="name">{{name}}</td>
          <td class="qty">{{qty}}</td>
          <td class="price">{{price}}</td>
          <td class="amount">{{amount}}</td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    <div class="divider"></div>
    <div class="total"><span>合计</span><span>&yen; {{total}}</span></div>
    <div class="meta" style="margin-top:1mm;">
      <div class="row"><span>支付方式</span><span>{{payMethod}}</span></div>
    </div>
    {{#if qrData}}
    <div class="qr"><img src="{{qrImageUrl}}" style="width:24mm;height:24mm;" /></div>
    <div class="sub">扫码评价 / 追踪订单</div>
    {{/if}}
    <div class="divider"></div>
    <div class="footer">{{footer}}</div>
  </div>
</body>
</html>
