<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  @page { size: {{pageWidthMm}}mm {{pageHeightMm}}mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: {{pageWidthMm}}mm;
    height: {{pageHeightMm}}mm;
    font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
    background: #fff;
    color: #000;
    overflow: hidden;
  }
  .label { padding: 1.5mm; display: flex; flex-direction: column; height: 100%; }
  .title { font-size: 11px; font-weight: bold; }
  .field { font-size: 10px; line-height: 1.5; }
  .code { flex: 1; display: flex; align-items: center; justify-content: center; }
  .code img { max-width: 90%; max-height: 90%; }
</style>
</head>
<body>
  <div class="label">
    <div class="title">{{title}}</div>
    <div class="field">编码：{{code}}</div>
    <div class="field">规格：{{spec}}</div>
    <div class="field">日期：{{date}}</div>
    <div class="code">{{#if codeImageUrl}}<img src="{{codeImageUrl}}" alt="" />{{/if}}</div>
  </div>
</body>
</html>
