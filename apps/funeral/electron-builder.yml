appId: com.company.funeral
# productName 决定安装目录与主 exe 名：必须 ASCII（electron-builder 对非 ASCII productName
# 强制回退 sanitized name，@app/funeral 会变成难看的 @appfuneral 目录）；
# 面向用户的名称（快捷方式/卸载列表）用中文，见 nsis.shortcutName / uninstallDisplayName
productName: FhKiosk
# Linux 可执行文件名：package.json name 是 @app/funeral，sanitize 后的 @appfuneral 不合法，需显式指定
executableName: FhKiosk
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!shots*/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
win:
  # Windows 自助一体机交付均为 x64；如需 Windows on ARM 在 arch 里追加 arm64
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
mac:
  # 注意：dmg 只能在 macOS 上构建（Windows/Linux 无法交叉打 mac 包），
  # 对外分发还需 Apple Developer 证书签名公证（identity: null 时本地自签仅限自测）
  target: dmg
  category: public.app-category.utilities
  icon: build/icon.icns
linux:
  # 国产化（信创）说明：
  # - UOS 统信 / 麒麟均为 Debian 系 → deb 直接适用
  # - arch 覆盖：x64 = 海光/兆芯，arm64 = 飞腾/鲲鹏（Electron 官方均有二进制）
  # - 龙芯 LoongArch 需龙芯社区移植版 Electron，electron-builder 不原生支持，未配置
  # - AppImage 在 Windows 上交叉构建需要 symlink 特权（EPERM），且 UOS/麒麟走 deb，不配置
  # - 真正的适配门槛在硬件外设（读卡器/打印机厂商 SDK 均为 Windows DLL），打包配置仅解决安装介质
  target:
    - target: deb
      arch: [x64, arm64]
  category: Utility
  icon: build/icon.png
nsis:
  # 安装包文件名（${version} 注入版本号，${ext} = exe）。英文文件名便于部署脚本/网盘分发
  artifactName: FhKiosk-Setup-${version}.${ext}
  # 面向用户的中文名：桌面快捷方式名称与「应用和功能」卸载列表里显示的名称
  shortcutName: 智慧殡仪自助终端
  uninstallDisplayName: 智慧殡仪自助终端
  # true = 一键安装（无向导，双击直接装完）；false = 分步向导（欢迎页 → 选目录 → 安装 → 完成）
  oneClick: false
  # true = 为这台电脑所有用户安装：装进 Program Files、写 HKLM 注册表，安装时弹 UAC 管理员授权；
  # false = 仅当前用户：装进 %LocalAppData%，不需要管理员权限
  perMachine: true
  # 向导目录页显示「浏览」按钮，允许用户自行修改安装位置（仅 oneClick: false 时有意义）
  allowToChangeInstallationDirectory: true
  # 完成页显示「运行 应用」复选框，装完可直接勾选启动
  runAfterFinish: true
  # 桌面快捷方式：always = 每次安装/升级都确保存在；true = 仅首次安装创建；false = 不创建
  createDesktopShortcut: always
  # 安装器以 Unicode 模式构建。false 时 NSIS 无法正确显示中文界面，必须为 true
  unicode: true
  # 安装器界面语言 ID：2052 = 简体中文
  language: 2052
  # 安装器可选语言列表（多语言时首启动页会弹语言选择；只配 zh_CN 则全程中文无选择步骤）
  installerLanguages: zh_CN
  # 安装/卸载程序 exe 自身显示的图标（资源管理器里 FhKiosk-Setup.exe 的图标）
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # 品牌图集中维护于 packages/config/brand（全应用共享一套，改一处全生效）；
  # 尺寸是 NSIS MUI2 固定规格：sidebar 164×314、header 150×57。
  # 若不配置这三项，builder 才会按文件名约定自动查找 build/ 下同名文件
  installerHeader: ../../packages/config/brand/installerHeader.bmp
  installerSidebar: ../../packages/config/brand/installerSidebar.bmp
  uninstallerSidebar: ../../packages/config/brand/uninstallerSidebar.bmp
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
