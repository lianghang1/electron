appId: com.company.desktop
productName: Desktop
directories:
  buildResources: build
# asar 热更引导器结构：app.asar → app.core.asar（真实代码），app.asar 重写为 KB 级引导器
# 钩子与引导器为全 app 共享（packages/core），接入方式见钩子头注释
afterPack: scripts/after-pack.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,tsconfig.json,tsconfig.node.json,tsconfig.web.json,contracts.d.ts}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
win:
  target: nsis
nsis:
  artifactName: ${productName}-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  unicode: true
  language: 2052
mac:
  target: dmg
  notarize: false
linux:
  target: AppImage
  category: Utility
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
