appId: com.company.funeral-kiosk
productName: FuneralKiosk
directories:
  buildResources: build
# asar 热更引导器结构：app.asar → app.core.asar（真实代码），app.asar 重写为 KB 级引导器
# 本文件是薄壳，共享实现在 packages/core/scripts/after-pack.cjs（见彼处头注释）
afterPack: scripts/after-pack.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # 资源源文件不进 asar：icon 经 ?asset 构建进 out/；路径读取的资源（设备 SDK DLL/
  # 授权文件等）经 extraResources 随包发布到 resourcesPath/resources
  - '!resources/**'
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  artifactName: FuneralKiosk-Setup-${version}.${ext}
  # 无人值守终端：一键静默装 + 用户级目录，更新链路（整包重装/热更）全程零 UAC
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  unicode: true
  language: 2052
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
