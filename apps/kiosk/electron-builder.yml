appId: com.company.kiosk
productName: Kiosk
directories:
  buildResources: build
# asar 热更引导器结构：app.asar → app.core.asar（真实代码），app.asar 重写为 KB 级引导器
# 钩子与引导器为全 app 共享（packages/core），接入方式见钩子头注释
afterPack: scripts/after-pack.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  artifactName: Kiosk-Setup-${version}.${ext}
  # 无人值守终端：一键静默装 + 用户级目录，更新链路（整包重装/热更）全程零 UAC
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  unicode: true
  language: 2052
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
