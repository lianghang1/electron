# 壳平台打包配置（flavor 驱动：一套壳 × N 产品，零代码差异）
# 用法：FLAVOR=kiosk pnpm build:win
#   flavor.json 由 scripts/prepare-flavor.mjs 复制进 resources/（组合根打包态从这里读）

appId: cn.shellplatform.${env.FLAVOR}
productName: ${env.FLAVOR_NAME}
directories:
  output: release/${env.FLAVOR}
  buildResources: build

files:
  - out/**

extraResources:
  # 产品形态清单：组合根打包态读取 resources/flavor.json
  - from: ../../apps/flavors/${env.FLAVOR}/flavor.json
    to: flavor.json
  # 应用 dist（packaged 形态）：各应用产物放 resources/apps/<appId>/
  - from: ../../resources/apps
    to: apps
  # 厂商驱动包（@device-sdk/* 私有包，见 docs/driver-packaging.md）：
  # 资产跟着驱动走——node_modules 里的包内容复制到 resources/devices/<域>/<厂商>/<平台>
  - from: node_modules/@device-sdk/
    to: devices

# SumatraPDF 等随包外部工具（可选）
# extraFiles:
#   - from: vendor/sumatra
#     to: sumatra

win:
  target:
    - target: nsis
      arch: [x64]
  # 国产化平台按需追加：electron 不支持的架构走 remote 形态（PlatformCapability 已声明）

nsis:
  oneClick: false
  # kiosk 静默更新依赖的静默参数（/S），full-package 通道退出时拉起
  allowToChangeInstallationDirectory: false
  perMachine: true
  deleteAppDataOnUninstall: false

mac:
  target: dmg
  category: public.app-category.business

linux:
  target:
    - deb
    - AppImage
