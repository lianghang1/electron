<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>壳平台</title>
    <style>
      html, body, #app { margin: 0; width: 100%; height: 100%; }
      /* 启动层：遮罩无底色，动画期透出窗口材质；#app 淡入与遮罩淡出交叉。
         --dt-accent 由 preload 同步注入（零闪烁）。换 logo 只改下面 .startup-logo 内的 SVG。 */
      #app { opacity: 0; transition: opacity 0.16s ease; }
      body.ready #app { opacity: 1; }
      #splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.16s ease;
      }
      body.ready #splash { pointer-events: none; opacity: 0; }
      /* logo 与窗口同帧出生：初始就是完整可见形态（不起播也恒在），
         introBegin 后只播放弹性微缩放——动画是 logo 的点缀，不是 logo 的出现方式，
         杜绝「窗口先出现、logo 迟到」的脱节观感 */
      .startup-logo-shell {
        position: relative; display: flex;
        width: 96px; height: 96px;
        align-items: center; justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.2), 0 8px 10px -6px rgb(0 0 0 / 0.2);
        /* paused 时停在 0% 帧（scale 1 完整可见）——起播前后画面无跳变 */
        animation: splash-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-play-state: paused;
        transform-origin: center;
      }
      .startup-logo-shell::before {
        position: absolute; inset: 0; pointer-events: none; content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }
      .startup-logo { width: 56px; height: auto; color: #ffffff; }
      @keyframes splash-pop {
        0% { transform: scale(1); }
        40% { transform: scale(1.05); }
        62% { transform: scale(0.985); }
        82% { transform: scale(1.01); }
        100% { transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="startup-logo-shell">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="56"
          height="56"
          fill="none"
          viewBox="0 0 48 48"
          class="startup-logo"
          aria-hidden="true"
        >
          <!-- 品牌标「上开口」：方形剪影 + 顶部 45° 斜槽（设备插入平台的端口意象） -->
          <path fill="currentColor" d="M6 6h15l14 14h6L27 6h15v36H6Z" />
        </svg>
      </div>
    </div>
    <div id="app"></div>
    <script>
      // 启动层双门闩：logo 动画播完（或 1s 兜底）且应用挂载完成，两个条件都满足才淡出。
      // 有意不做「挂载超时兜底撤层」：应用挂载失败时宁可停在 logo（运维能看出异常），
      // 也不露出无提示的破碎白屏。
      const splash = document.getElementById('splash')
      const shell = document.querySelector('.startup-logo-shell')
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      // logo 最短驻留：即使动画与挂载都已就绪，也要保证弹出段+驻留在屏幕上完整呈现
      const MIN_SPLASH_MS = 600
      let finished = false
      let animationDone = false
      let appReady = false
      let introStartedAt = 0
      const tryFinish = () => {
        if (finished || !animationDone || !appReady || !splash) { return }
        if (!introStartedAt || Date.now() - introStartedAt < MIN_SPLASH_MS) { return }
        finished = true
        document.body.classList.add('ready')
        window.setTimeout(() => splash.remove(), 500)
      }
      const markAnimationDone = () => { animationDone = true; tryFinish() }
      const markAppReady = () => { appReady = true; tryFinish() }
      // 应用侧（apps/shell/src/main.ts）在 Vue 挂载 + 首帧 rAF 后派发
      window.addEventListener('shell-app-ready', markAppReady, { once: true })
      // 一切计时与动画统一以「主进程确认首帧已绘」为起点（shell:introBegin 推送）。
      // 窗口上屏时机只有主进程知道：渲染层 visibilityState 在壳窗口（禁用 Win 遮罩
      // 计算）下从加载起恒为 visible，若据它起播，动画会在窗口上屏前被整段消耗——
      // 上屏即应用界面，这正是「启动动画有时显示不出来」的根因。
      const beginIntro = () => {
        if (introStartedAt) { tryFinish(); return }
        introStartedAt = Date.now()
        if (reduceMotion || !shell) {
          markAnimationDone()
        }
        else {
          shell.addEventListener('animationend', markAnimationDone, { once: true })
          shell.style.animationPlayState = 'running'
          window.setTimeout(markAnimationDone, 1000)
        }
        // 最短驻留到期后复核撤层：门闩条件可能早已全部满足，只差驻留时长
        window.setTimeout(tryFinish, MIN_SPLASH_MS)
      }
      const bridge = window.desktop?.shell
      if (typeof bridge?.onIntroBegin === 'function') {
        bridge.onIntroBegin(beginIntro)
      }
      else {
        // 桥缺失（纯浏览器预览等）：退回 visibility 信号
        if (document.visibilityState === 'visible') { beginIntro() }
        else {
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { beginIntro() }
          }, { once: true })
        }
      }
    </script>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
